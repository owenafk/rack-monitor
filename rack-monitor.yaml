# Rack environment monitor - ESP32-C3 Super Mini + AHT10 + LM393 rain/leak board
#
# Wiring (everything on 3V3 - do NOT power the rain board from 5V, its AO would
# exceed what the ESP32-C3's ADC can read):
#   AHT10  VIN -> 3V3      GND -> GND     SDA -> GPIO6    SCL -> GPIO7
#   Rain   VCC -> GPIO10   GND -> GND     AO  -> GPIO0    DO  -> (not needed)
#
# The rain board is powered from GPIO10 and only switched on for a moment during
# each reading. A probe that is powered all the time corrodes within weeks.
# The wet/dry threshold is a slider in Home Assistant, so the board's pot doesn't matter.

esphome:
  name: rack-monitor
  friendly_name: Rack Monitor
  area: Server Rack     # change to the Home Assistant area your rack is in

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret rack_monitor_api_key   # ESPHome generates this when you create the device

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB   # C3 Super Mini antenna flaw: full power fails with 'Auth Expired'
  ap: {}            # fallback hotspot if it can't join your Wi-Fi

captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

output:
  - platform: gpio
    pin: GPIO10
    id: rain_power

number:
  - platform: template
    id: wet_threshold
    name: "Leak threshold"
    icon: mdi:water-alert
    entity_category: config
    unit_of_measurement: V
    min_value: 0.5
    max_value: 3.2
    step: 0.05
    initial_value: 2.5   # dry probe reads ~3.2 V; water pulls it down
    optimistic: true
    restore_value: true

sensor:
  - platform: aht10
    variant: AHT10       # if the log shows read errors, change to AHT20
    temperature:
      name: "Temperature"
      # filters:
      #   - offset: -0.5   # trim if it reads high vs. a reference thermometer
    humidity:
      name: "Humidity"
    update_interval: 30s

  - platform: adc
    pin: GPIO0
    id: rain_raw
    name: "Leak sensor voltage"
    attenuation: 12db
    update_interval: never     # read on demand by the interval below
    entity_category: diagnostic
    accuracy_decimals: 2

  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Leak"
    device_class: moisture
    lambda: |-
      if (isnan(id(rain_raw).state)) return {};
      return id(rain_raw).state < id(wet_threshold).state;
    filters:
      - delayed_off: 30s       # don't flap while the probe dries

interval:
  - interval: 10s
    then:
      - output.turn_on: rain_power
      - delay: 100ms
      - component.update: rain_raw
      - output.turn_off: rain_power
