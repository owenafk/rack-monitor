<text x='90' y='960' font-family='Helvetica, Arial, sans-serif' font-size='19' fill='#555' text-anchor='start' font-weight='normal'>The rain board is powered from GPIO10 so it is only switched on for each reading — this stops the plate corroding.</text>
<text x='90' y='988' font-family='Helvetica, Arial, sans-serif' font-size='19' fill='#555' text-anchor='start' font-weight='normal'>Don't power the rain board from 5 V: its output would be more than the ESP can read.</text>
